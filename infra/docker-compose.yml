# version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops
      POSTGRES_DB: devops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ../BE
    container_name: backend_app
    restart: always
    env_file:
      - ../BE/.env
    depends_on:
      - postgres
    ports:
      - "5001:5001"

  frontend:
    build: ../fe
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
